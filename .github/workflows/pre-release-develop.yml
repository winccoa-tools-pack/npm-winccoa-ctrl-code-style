name: Pre-Release (Develop and Release)

on:
  workflow_run:
    workflows:
      - "CI/CD Pipeline"
    types:
      - completed
    branches:
      - develop
      - 'release/**'
  workflow_dispatch:
    inputs: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  pre-release:
    if: |
      (
        github.ref_name == 'develop' ||
        startsWith(github.ref_name, 'release/')
      ) && github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        (
          github.event.workflow_run.head_branch == 'develop' ||
          startsWith(github.event.workflow_run.head_branch, 'release/')
        )
      )
    uses: ./.github/workflows/prerelease-reusable.yml
    with:
      target_branch: ${{ github.event.workflow_run.head_branch || github.ref_name }}
      validate_release_branch: ${{ startsWith(github.event.workflow_run.head_branch || github.ref_name, 'release/') }}
      publish_to_npm: false
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  notify-success:
    runs-on: ubuntu-latest
    needs: [pre-release]
    if: success()

    steps:
      - name: Success Notification
        run: |
          echo "Prerelease ${{ needs.pre-release.outputs.tag }} created successfully!"
          echo "📦 npm tarball (*.tgz) attached to the GitHub pre-release"
          echo "📝 Auto-generated from develop (not published to npm)"
          echo ""
          echo "🔗 Pre-release URL: https://github.com/${{ github.repository }}/releases/tag/${{ needs.pre-release.outputs.tag }}"
